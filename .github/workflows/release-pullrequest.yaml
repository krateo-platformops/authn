# PR CI via shared reusable workflows (krateo-platformops/.github): a validate-only multi-platform
# image build (component-image-build, push: false) + Go checks (component-go-checks: unit tests +
# CRD-drift guard) run from the go/authn module dir. One source of truth, and go/-fold-safe.
name: release-pullrequest

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"authn","context":"go/authn"}]'
      push: false
  # Krateo Documentation Standard conformance (shared org workflow): the invariant
  # docs/ file set, frontmatter, link integrity, banned dead-org strings, examples
  # pairing.
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main
  checks:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/authn
      crd_drift: true
      test_args: -race -coverprofile=coverage.txt -covermode=atomic ./...
    secrets: inherit
