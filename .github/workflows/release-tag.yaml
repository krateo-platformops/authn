# Krateo COMPONENT release workflow — authn variant. The `build` job now calls the SHARED
# reusable multi-platform image build (krateo-platformops/.github) — one source of truth, no
# per-repo drift. The `crds` job stays authn-specific: it runs the agnostic `make generate`
# entry point and opens a PR into the component's chart repo refreshing crds-subchart/.
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"authn","context":"go/authn"}]'
