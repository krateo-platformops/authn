# The storage integration suite against a real apiserver, on every PR (and push to main) that
# can change what it proves (authn#127).
#
# It is the only proof that storage.Put's create, then update after a 409, and the Written it
# returns (verb, status code, uid, resourceVersion) hold against a real apiserver: the audit
# record of every credential authn issues (AUDIT-4) is built from that Written. Until now it ran
# only on a developer's machine, so a change breaking it could go green.
#
# kind, per PR (Diego, 2026-11-11): the suite uses only Secret create/update/get, which a kind
# apiserver serves as a managed one does, with no cloud credentials and no cost.
#
# No kind setup action: the suite creates, names and destroys its OWN cluster through
# e2e-framework (envfuncs.CreateCluster + kind.NewProvider, cluster "authn-storage-test"), and
# findOrInstallKind fetches the kind binary when it is absent. Provisioning one here would add a
# second, unused cluster (plumbing's test.yaml does the same).
#
# The crd-names job (authn#140) proves the User and ServiceAccount CRDs' name rule on a real
# apiserver: a name authn's Secret naming would rewrite is refused at create, while an object
# created before the rule stays updatable and deletable. Its suite (apis/, cluster
# "authn-crdnames-test") pins kindest/node:v1.36.4, the shared clusters' version, which
# e2e-framework's fallback kind (v0.26.0) can't be relied on to run, so the job installs a pinned
# kind first and e2e-framework uses the one on PATH.
#
# A separate workflow rather than a job in release-pullrequest.yaml, because only it can filter by
# path. It is not a required check, so a PR it doesn't run on isn't held. If it fails with
# `failed to create cluster`, it is the runner's capacity, not the code.
name: storage-integration

on:
  pull_request:
    branches:
      - main
    paths:
      - go/authn/internal/helpers/kube/**
      - go/authn/apis/**
      - go/authn/crds/**
      - go/authn/go.mod
      - go/authn/go.sum
      - .github/workflows/storage-integration.yaml
  push:
    branches:
      - main
    paths:
      - go/authn/internal/helpers/kube/**
      - go/authn/apis/**
      - go/authn/crds/**
      - go/authn/go.mod
      - go/authn/go.sum
      - .github/workflows/storage-integration.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    name: storage (real apiserver, kind)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go/authn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/authn/go.mod
          cache-dependency-path: go/authn/go.sum

      - name: Storage integration suite (kind)
        run: go test -tags integration -count=1 -v ./internal/helpers/kube/config/storage/

  crd-names:
    name: crd names (real apiserver, kind)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go/authn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/authn/go.mod
          cache-dependency-path: go/authn/go.sum

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          test "$(command -v kind)" = "$(go env GOPATH)/bin/kind"
          kind version

      - name: CRD name rule suite (kind)
        run: go test -tags integration -count=1 -v ./apis/
