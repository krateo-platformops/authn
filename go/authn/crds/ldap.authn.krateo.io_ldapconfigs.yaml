---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: ldapconfigs.ldap.authn.krateo.io
spec:
  group: ldap.authn.krateo.io
  names:
    categories:
    - krateo
    - authn
    - ldap
    kind: LDAPConfig
    listKind: LDAPConfigList
    plural: ldapconfigs
    singular: ldapconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LDAPConfig is a AuthN Service LDAP configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              baseDN:
                description: 'BaseDN: specifies the base of the subtree in which the
                  search is to be constrained.'
                type: string
              bindDN:
                description: |-
                  BindDN: specifies the username of the bind user
                  not necessary if the LDAP server supports anonymous searches.
                type: string
              bindSecret:
                description: |-
                  BindSecret: specifies the password of the bind user
                  not necessary if the LDAP server supports anonymous searches.
                properties:
                  key:
                    description: The key to select.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                  namespace:
                    description: Namespace of the referenced object.
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
              dialURL:
                description: 'DialURL: LDAP Server address.'
                type: string
              graphics:
                description: An object that contains the description of the frontend
                  elements of this login method
                properties:
                  backgroundColor:
                    description: Background color of the login button
                    type: string
                  displayName:
                    description: Text on the login button
                    type: string
                  icon:
                    description: Icon of the login button
                    type: string
                  textColor:
                    description: Text color of the login button
                    type: string
                required:
                - backgroundColor
                - displayName
                - icon
                - textColor
                type: object
              groupSearch:
                description: |-
                  GroupSearch configures how a user's groups are found after their bind
                  succeeds. Omitted, every field takes its default.
                properties:
                  baseDN:
                    description: |-
                      BaseDN is the base of the subtree the group search is constrained to.
                      Default: spec.baseDN.
                    type: string
                  filter:
                    description: |-
                      Filter selects the user's groups. It is a Go text/template over the
                      authenticated user, with two fields: .DN, the DN the user bound as, and
                      .Username, the login name. Both are already escaped for an LDAP filter.
                      Default: member or uniqueMember equal to .DN, which covers
                      groupOfNames, Active Directory and groupOfUniqueNames. For posixGroup,
                      match memberUid to .Username. A template that doesn't parse, or that
                      doesn't render a valid LDAP filter, fails every login with a 500
                      (LDAPConfigInvalid). See docs/api.md for examples.
                    type: string
                  nameAttribute:
                    description: |-
                      NameAttribute is the group entry attribute whose value is the group's
                      name. A group entry without it is skipped. Default: cn.
                    type: string
                type: object
              tls:
                type: boolean
            required:
            - baseDN
            - dialURL
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
