---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-system
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: authn
  namespace: demo-system
---
apiVersion: v1
kind: Service
metadata:
  name: authn
  namespace: demo-system
spec:
  selector:
    app: authn
  type: NodePort
  ports:
  - name: http
    port: 8082
    targetPort: http
    protocol: TCP
    nodePort: 30082
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-admin
  namespace: demo-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-admin-binding
  namespace: demo-system
subjects:
- kind: ServiceAccount
  name: authn
  namespace: demo-system
roleRef:
  kind: Role
  name: secrets-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authn
  namespace: demo-system
  labels:
    app: authn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authn
  template:
    metadata:
      labels:
        app: authn
    spec:
      serviceAccountName: authn
      # Mirror the chart's hardened defaults so local dev matches prod posture. The image is
      # distroless/static:nonroot (UID/GID 65532); authn writes kubeconfigs as Secrets via the API.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
      # The RSA private key authn signs RS256 JWTs with. Create it first:
      #   openssl genrsa -out private.pem 2048
      #   kubectl create secret generic authn-jwt-signing-key -n demo-system \
      #     --from-file=private.pem=./private.pem
      - name: jwt-signing-key
        secret:
          secretName: authn-jwt-signing-key
          items:
          - key: private.pem
            path: private.pem
      containers:
      - name: authn
        #image: kind.local/authn:latest
        image: authn:latest
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        args:
          - --debug=true
          - --kubeconfig-server-url=https://127.0.0.1:57456
          - --namespace=demo-system
          - --jwt-sign-key-file=/etc/authn/jwt/private.pem
          - --jwt-kid=krateo-authn-key-1
        ports:
        - name: http
          containerPort: 8082
        volumeMounts:
        - name: jwt-signing-key
          mountPath: /etc/authn/jwt
          readOnly: true
