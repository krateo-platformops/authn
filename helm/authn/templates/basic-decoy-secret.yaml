{{- /*
Not a credential. /basic/login reads this Secret for an unknown user, so that a
refusal costs the Secret read a known user's does, and the time taken doesn't
tell a caller which users exist. The login is refused whatever it holds.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authn.fullname" . }}-basic-decoy
  labels:
    {{- include "authn.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: "this value is not a credential"
