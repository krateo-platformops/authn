{{- $ref := ((.Values.internal).tls).issuerRef | default dict }}
{{- if $ref.name }}
{{- if not (has $ref.kind (list "Issuer" "ClusterIssuer")) }}
{{- fail (printf "internal.tls.issuerRef.kind must be Issuer or ClusterIssuer, not %q" $ref.kind) }}
{{- end }}
{{- $svc := printf "%s-internal" (include "authn.fullname" .) }}
# The internal listener's certificate (authn#145): cert-manager issues and
# rotates it in <release>-internal-tls, which the Deployment mounts. authn
# serves the internal port over TLS only and reloads the files on rotation.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $svc }}
  labels:
    {{- include "authn.labels" . | nindent 4 }}
spec:
  secretName: {{ $svc }}-tls
  dnsNames:
    - {{ $svc }}
    - {{ $svc }}.{{ .Release.Namespace }}
    - {{ $svc }}.{{ .Release.Namespace }}.svc
    - {{ $svc }}.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - server auth
    - digital signature
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: {{ $ref.kind }}
    name: {{ $ref.name }}
{{- end }}
