apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authn.fullname" . }}
  labels:
    {{- include "authn.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "authn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ printf "%s" (include (print $.Template.BasePath "/configmap.yaml") .) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "authn.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "authn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "authn.fullname" . }}
          envFrom:
            - configMapRef:
                name: {{ include "authn.fullname" . }}
          env:
            - name: JWT_SIGN_KEY_FILE
              value: "{{ .Values.jwt.mountPath }}/{{ .Values.jwt.signKeySecretKey }}"
            - name: JWT_KID
              value: {{ .Values.jwt.kid | quote }}
            {{- with include "authn.jwtPreviousKeys" . }}
            - name: JWT_PREVIOUS_KEYS
              value: {{ . | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "krateo.image" (dict "img" .Values.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: jwt-signing-key
              mountPath: {{ .Values.jwt.mountPath }}
              readOnly: true
            {{- range $i, $k := (.Values.jwt.previousKeys | default list) }}
            - name: jwt-previous-key-{{ $i }}
              mountPath: /etc/authn/jwt-previous/{{ $i }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: jwt-signing-key
          secret:
            secretName: {{ .Values.jwt.signKeySecretName }}
            items:
              - key: {{ .Values.jwt.signKeySecretKey }}
                path: {{ .Values.jwt.signKeySecretKey }}
        {{- range $i, $k := (.Values.jwt.previousKeys | default list) }}
        {{- $key := $k.secretKey | default "private.pem" }}
        - name: jwt-previous-key-{{ $i }}
          secret:
            secretName: {{ required "jwt.previousKeys[].secretName is required" $k.secretName }}
            items:
              - key: {{ $key }}
                path: {{ $key }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
