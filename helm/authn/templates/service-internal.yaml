# authn's internal listener (POST /usernames/check), for in-cluster callers
# only. ClusterIP always, whatever service.type says, and never referenced by
# an Ingress or HTTPRoute: whether a username is held is decided in-cluster,
# never on a public surface.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "authn.fullname" . }}-internal
  labels:
    {{- include "authn.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.internal.port }}
      targetPort: internal
      protocol: TCP
      name: internal
  selector:
    {{- include "authn.selectorLabels" . | nindent 4 }}
