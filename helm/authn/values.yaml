# Default values for authn.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global values shared across (sub)charts.
global:
  # Optional registry-host override applied to EVERY image (mirror / air-gapped installs).
  # When set, it replaces the per-image `registry` host; repository paths are preserved.
  imageRegistry: ""

replicaCount: 1

image:
  registry: ghcr.io
  repository: krateo-platformops/authn
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "authn"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Hardened by default. The shipped image is gcr.io/distroless/static:nonroot (USER nonroot,
# UID/GID 65532); authn persists kubeconfigs as Kubernetes Secrets via the API (never the local
# filesystem) and listens on an unprivileged port, so runAsNonRoot + readOnlyRootFilesystem are
# safe. Override per-field if you run a custom image with a different user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  annotations: {}
  type: ClusterIP
  port: 8082

# authn's internal listener: calls only in-cluster services make
# (POST /usernames/check). It is served by its own ClusterIP Service,
# <release>-internal, which no Ingress or HTTPRoute may reference: the public
# Service's routes forward every path to the public port, never to this one.
internal:
  port: 8090

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Probe tolerances are explicit because the Kubernetes defaults (timeoutSeconds: 1,
# failureThreshold: 3) are too twitchy for authn under CPU contention: a healthy pod that
# misses the 1s deadline three times gets killed, and since authn fronts login, every
# restart is a visible "can't retrieve authentication methods" window. Liveness is lenient
# (~60s of unresponsiveness before a restart — only truly dead processes get killed);
# readiness keeps the default failureThreshold so a genuinely slow pod still drops from
# endpoints promptly, but with a 5s timeout so load alone doesn't flap it.
livenessProbe:
  httpGet:
    path: /health
    port: http
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /health
    port: http
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

otel:
  # The OTLP/HTTP endpoint for every signal: the node-local collector agent.
  # $(HOST_IP) is the node's IP. The gates are env.OTEL_ENABLED and the
  # per-signal OTEL_TRACING_ENABLED, OTEL_METRICS_ENABLED, OTEL_LOGS_ENABLED.
  endpoint: "http://$(HOST_IP):4318"

env:
  # OpenTelemetry on: traces, metrics, and audit records (AUDIT-4), to otel.endpoint.
  # Each signal follows it unless set on its own (OTEL_TRACING_ENABLED, ...).
  OTEL_ENABLED: "true"
  # Debug logs carry each OIDC and OAuth sign-in's name, username, email, groups and
  # avatar URL, and the values a RESTAction adds. Turn it on to debug, not in production.
  AUTHN_DEBUG: "false"
  AUTHN_KUBECONFIG_CLUSTER_NAME: "krateo"
  AUTHN_KUBECONFIG_CRT_EXPIRES_IN: "24h"
  # In-cluster apiserver URL baked into every generated <user>-clientconfig Secret's
  # server-url. MUST be reachable + CA/SAN-valid from in-cluster consumers (the
  # cert-replay per-user RBAC hop reads it raw via endpoints.FromSecret). The old
  # placeholder "https://kube-apiserver:6443" is a kubeadm-style name that resolves
  # NOWHERE on managed k8s (GKE: NXDOMAIN, wrong port) — it broke every per-user
  # RBAC call. kubernetes.default.svc is a universal apiserver SAN validated by the
  # cluster CA already stored in each Secret (matches plumbing context.go / snowplow
  # sa_client.go). Leave empty ("") to let authn auto-derive KUBERNETES_SERVICE_HOST:PORT.
  AUTHN_KUBECONFIG_SERVER_URL: "https://kubernetes.default.svc"
  AUTHN_CORS: "true"
  # authn's own client certificate (authn-clientconfig, the identity snowplow
  # presents for authn's RESTActions) is renewed in the background. The signer may
  # grant less than requested (OpenShift caps at 720h), so renewal fires at
  # AUTHN_CRT_RENEWAL_THRESHOLD of the GRANTED lifetime. Only the replica holding the
  # authn-cert-renewal Lease renews, so any replicaCount is safe.
  # See docs/certificate-renewal.md.
  AUTHN_SERVICE_CRT_EXPIRES_IN: "8760h"
  AUTHN_CRT_RENEWAL_THRESHOLD: "0.66"
  AUTHN_CRT_RENEWAL_ENABLED: "true"

# JWT signing key configuration.
# authn signs tokens with an RSA private key (RS256) and publishes the matching
# public key as a JWKS at GET /.well-known/jwks.json. The private key is mounted
# from a Secret as a file (never injected as an env var).
jwt:
  # Name of the Secret holding the PEM-encoded RSA private key.
  signKeySecretName: authn-jwt-signing-key
  # Key inside that Secret whose value is the PEM private key; it is also the
  # mounted filename.
  signKeySecretKey: private.pem
  # Directory the Secret is mounted into. The container reads
  # <mountPath>/<signKeySecretKey> (exposed as JWT_SIGN_KEY_FILE).
  mountPath: /etc/authn/jwt
  # Key ID advertised in every token header and in the JWKS "kid". Must be
  # stable for the lifetime of the key so validators can match it.
  kid: krateo-authn-key-1
  # Keys retired by a rotation, published in the JWKS for verification only, so
  # tokens they signed stay valid until they expire. authn never signs with
  # them. Each entry names its kid and a Secret holding the PEM key (the
  # retired private key, or just its public half) under secretKey (default
  # private.pem). Rotation: add the current key here, point signKeySecretName
  # and kid at the new key, and remove the entry once every token it signed has
  # expired (AUTHN_KUBECONFIG_CRT_EXPIRES_IN, 24h by default). See
  # docs/jwt-jwks.md.
  previousKeys: []
  #  - kid: krateo-authn-key-1
  #    secretName: authn-jwt-signing-key-1
  #    secretKey: private.pem
