# Default values for authn.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global values shared across (sub)charts.
global:
  # Optional registry-host override applied to EVERY image (mirror / air-gapped installs).
  # When set, it replaces the per-image `registry` host; repository paths are preserved.
  imageRegistry: ""

replicaCount: 1

image:
  registry: ghcr.io
  repository: krateo-platformops/authn
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "authn"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  annotations: {}
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Probe tolerances are explicit because the Kubernetes defaults (timeoutSeconds: 1,
# failureThreshold: 3) are too twitchy for authn under CPU contention: a healthy pod that
# misses the 1s deadline three times gets killed, and since authn fronts login, every
# restart is a visible "can't retrieve authentication methods" window. Liveness is lenient
# (~60s of unresponsiveness before a restart — only truly dead processes get killed);
# readiness keeps the default failureThreshold so a genuinely slow pod still drops from
# endpoints promptly, but with a 5s timeout so load alone doesn't flap it.
livenessProbe:
  httpGet:
    path: /health
    port: http
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /health
    port: http
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

env:
  AUTHN_DEBUG: "true"
  AUTHN_KUBECONFIG_CLUSTER_NAME: "krateo"
  AUTHN_KUBECONFIG_CRT_EXPIRES_IN: "24h"
  AUTHN_KUBECONFIG_SERVER_URL: "https://kube-apiserver:6443"
  AUTHN_CORS: "true"
  AUTHN_DUMP_ENV: "true"

# JWT signing key configuration.
# authn signs tokens with an RSA private key (RS256) and publishes the matching
# public key as a JWKS at GET /.well-known/jwks.json. The private key is mounted
# from a Secret as a file (never injected as an env var).
jwt:
  # Name of the Secret holding the PEM-encoded RSA private key.
  signKeySecretName: authn-jwt-signing-key
  # Key inside that Secret whose value is the PEM private key; it is also the
  # mounted filename.
  signKeySecretKey: private.pem
  # Directory the Secret is mounted into. The container reads
  # <mountPath>/<signKeySecretKey> (exposed as JWT_SIGN_KEY_FILE).
  mountPath: /etc/authn/jwt
  # Key ID advertised in every token header and in the JWKS "kid". Must be
  # stable for the lifetime of the key so validators can match it.
  kid: krateo-authn-key-1