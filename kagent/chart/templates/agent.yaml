apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: krateo-authn-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: krateo-authn-agent
    app.kubernetes.io/part-of: krateo-authn
spec:
  type: Declarative
  description: >-
    Authors and troubleshoots Krateo authentication across its four methods — basic-auth User
    (basic.authn.krateo.io), LDAPConfig (ldap.authn.krateo.io), OIDCConfig (oidc.authn.krateo.io), and
    OAuthConfig (oauth.authn.krateo.io) plus their auth Secrets — grounded in the braghettos/krateo-authn
    codebase and braghettos/krateo-authn-chart CRDs/docs.
  declarative:
    deployment:
      env:
{{- include "authn-agent.genaiEnv" . | nindent 8 }}
    modelConfig: {{ .Values.modelConfig.name }}
    stream: true
    promptTemplate:
      dataSources:
        - kind: ConfigMap
          name: authn-agent-prompts-{{ .Values.prompts.language }}
          alias: prompts
    systemMessage: |
      {{`{{include "prompts/authn_agent"}}`}}
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
{{- if .Values.hitlApproval }}
          # HITL: mutating tools pause for human approval (kagent requireApproval)
          requireApproval:
            - k8s_apply_manifest
            - k8s_patch_resource
{{- end }}
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_resource_yaml
            - k8s_apply_manifest
            - k8s_patch_resource
{{- if .Values.fetch.enabled }}
      # Tokenless doc grounding: GET the version-pinned raw docs/llms.txt URL (public, no auth/token).
      - type: McpServer
        mcpServer:
          name: {{ .Values.fetch.mcpServer }}
          kind: MCPServer
          apiGroup: kagent.dev
          toolNames:
            - fetch
{{- end }}
{{- if .Values.github.enabled }}
      # Reads the agent's component sources (braghettos/krateo-authn codebase + krateo-authn-chart)
      # so it can ground answers in the actual code and chart, per the /kagent standard.
      - type: McpServer
        mcpServer:
          name: {{ .Values.github.mcpServer }}
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - get_file_contents
            - search_code
            - search_repositories
            - list_commits
{{- end }}
    a2aConfig:
      skills:
        - id: manage-authn-methods
          name: Manage Krateo AuthN Methods
          description: >-
            Create and troubleshoot the four Krateo auth methods (basic User, LDAPConfig, OIDCConfig,
            OAuthConfig) with their backing Secrets, grounded in the authn CRDs, chart, and codebase.
          tags: [krateo, authn, authentication, ldap, oidc, oauth]
          examples:
            - Set up basic authentication by creating a User and its basic-auth Secret.
            - Configure OIDCConfig against Azure Entra for our identity provider.
            - Add a GitHub OAuthConfig with the mandatory restActionRef to resolve user groups.
            - Why is my LDAPConfig not mapping LDAP groups to Krateo admins/devs?
        - id: explain-authn-login-flow
          name: Explain AuthN Login and Group Mapping
          description: >-
            Explain how each Krateo auth method logs a user in, the required redirect URIs, and how
            users map to Krateo groups, verified against version-pinned docs.
          tags: [krateo, authn, login, groups, redirect-uri]
          examples:
            - Which auth methods does Krateo support and what CRs and Secrets does each need?
            - What redirect URI should I set for OIDC versus OAuth login?
            - How do OAuthConfig users get mapped to the admins and devs groups?
    deployment:
      resources:
{{- toYaml .Values.resources | nindent 8 }}
